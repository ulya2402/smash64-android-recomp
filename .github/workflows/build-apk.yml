name: Build Android Recompile APK (arm64-v8a)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK, NDK 27, and CMake 3.22.1
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
            unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
            mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm cmdline-tools.zip
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Fetch SDL3 Java + Native Sources
        run: |
          if [ ! -d "third_party/SDL" ]; then
            git clone --depth 1 --branch release-3.2.8 https://github.com/libsdl-org/SDL.git third_party/SDL
          fi

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Debug APK (arm64-v8a)
        run: gradle assembleDebug --no-daemon

      - name: Verify native .so dependencies (llvm-readelf)
        run: |
          READELF="${ANDROID_HOME}/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          for LIB in libgame_recomp.so liblauncher_jni.so; do
            SO_FILE=$(find app/build -name "$LIB" | head -n 1)
            if [ -z "$SO_FILE" ]; then
              echo "ERROR: $LIB not found!"
              exit 1
            fi
            echo "=== Verifying $SO_FILE ==="
            "$READELF" -d "$SO_FILE"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smash64-nalp-recomp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
